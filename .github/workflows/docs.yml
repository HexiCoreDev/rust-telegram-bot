name: Deploy mdBook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          TAG=$(curl -sL https://api.github.com/repos/rust-lang/mdBook/releases/latest | jq -r '.tag_name')
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${TAG}/mdbook-${TAG}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build book
        run: mdbook build book

      # `mdbook test` is deliberately NOT run here, and cannot be made to work
      # for this book. Its rustdoc backend runs `rustdoc --test` against a
      # generated crate with no `--extern` linkage to the workspace, so every
      # block referencing `rust_tg_bot` or `tokio` fails on "cannot find crate"
      # regardless of its content, and the many fragments continuing an earlier
      # block on the same page fail on unresolved names. The
      # `[rust] edition = "2021"` setting in book/book.toml does fix the
      # edition-2015 rejection of `async fn`, but not the linkage.
      #
      # What actually validates the code is tools/examples_smoke.py (all 26
      # examples started against the live Bot API, in the `examples` CI job) and
      # tools/check_book_drift.py (snippets that drifted from their example).
      - name: Check the example index and book drift
        run: |
          python3 tools/check_examples_index.py
          python3 tools/check_book_drift.py || \
            echo "::warning::book snippets have drifted from their examples (run tools/check_book_drift.py --explain)"

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} book/book
