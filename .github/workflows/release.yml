name: Release

# Two triggers, two different outcomes:
#
#   * a push to `main` publishes the version in `Cargo.toml` to crates.io;
#   * a push of a `v*` tag does the same (the publish job then skips crates that
#     are already on crates.io) and additionally opens a GitHub Release.
#
# The book does not go through here: `.github/workflows/docs.yml` builds and
# deploys it to Vercel on every push to `main`.
on:
  push:
    tags: ["v*"]
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 8388608

jobs:
  # ── Run full CI before releasing ──────────────────────────────────
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  # ── Create GitHub Release (tag pushes only) ───────────────────────
  # There are no binaries to attach: this is a library crate, and
  # `cargo build -p rust-tg-bot` produces `librust_tg_bot.rlib`, not an
  # executable. The release page carries the generated notes plus links to the
  # published crates and the rendered book.
  release:
    name: GitHub Release
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Publish to crates.io (on merge to main or tag push) ──────────
  publish:
    name: Publish to crates.io
    needs: ci
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Publishing runs on every push to `main`, so follow-up commits (docs,
      # chores) would otherwise fail with "crate version already uploaded".
      # Skip the whole job when the version is already on crates.io; the tag
      # push that usually follows a release therefore becomes a no-op here.
      - name: Check whether this version is already published
        id: published
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "rust-tg-bot") | .version')
          # crates.io rejects requests without a User-Agent with HTTP 403, which
          # would otherwise read as "not published" and make the guard useless.
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: rust-tg-bot-release-ci (github.com/HexiCoreDev/rust-telegram-bot)' \
            "https://crates.io/api/v1/crates/rust-tg-bot/${version}")
          echo "workspace version: ${version} (crates.io HTTP ${status})"
          case "${status}" in
            200)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::${version} is already on crates.io; skipping cargo publish."
              ;;
            404)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::crates.io returned HTTP ${status} for ${version}; attempting publish anyway."
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Publish rust-tg-bot-raw
        if: steps.published.outputs.skip != 'true'
        run: cargo publish -p rust-tg-bot-raw
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index update
        if: steps.published.outputs.skip != 'true'
        run: sleep 30

      - name: Publish rust-tg-bot-macros
        if: steps.published.outputs.skip != 'true'
        run: cargo publish -p rust-tg-bot-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index update
        if: steps.published.outputs.skip != 'true'
        run: sleep 30

      - name: Publish rust-tg-bot-ext
        if: steps.published.outputs.skip != 'true'
        run: cargo publish -p rust-tg-bot-ext
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index update
        if: steps.published.outputs.skip != 'true'
        run: sleep 30

      - name: Publish rust-tg-bot
        if: steps.published.outputs.skip != 'true'
        run: cargo publish -p rust-tg-bot
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
