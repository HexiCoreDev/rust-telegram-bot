[book]
title = "rust-tg-bot"
authors = ["Jude Etuka"]
description = "Complete Telegram Bot API framework for Rust"
language = "en"
src = "src"

# mdbook drives `rustdoc --test --edition 2015` by default, which rejects every
# `async fn` in this book. The crate itself is edition 2021.
[rust]
edition = "2021"

[output.html]
git-repository-url = "https://github.com/HexiCoreDev/rust-telegram-bot"
edit-url-template = "https://github.com/HexiCoreDev/rust-telegram-bot/edit/main/book/{path}"
default-theme = "rust"
preferred-dark-theme = "ayu"
